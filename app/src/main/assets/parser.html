<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="./xlsx.full.min.js"></script>
<script>
/* ====== 与 HTML 原型对齐的课表解析管线(已用真实 xls 回归:26/26) ====== */
const BANDS = [{label:'1-2节'},{label:'3-4节'},{label:'5-6节'},{label:'7-8节'},{label:'9-10节'},{label:'11-12节'}];
const DAYCN = ['一','二','三','四','五','六','日'];

function parseWeeksStr(s, parity, totalWeeks){
  const out = [];
  String(s).split(/[,、;；\s]+/).forEach(tok0=>{
    if(!tok0) return;
    const pm = tok0.match(/(单|双)$/);
    const par = pm ? (pm[1]==='单'?'odd':'even') : parity;
    const tok = tok0.replace(/[单双]$/,'');
    const segs = tok.split(/[-－~]/).map(x=>x.trim()).filter(Boolean);
    const flat = [];
    segs.forEach(seg=>{
      if(!/^\d+$/.test(seg)) return;
      const n = +seg;
      if(n > 30){
        if(seg.length===3) flat.push(+seg[0], +seg.slice(1));
        else if(seg.length===4) flat.push(+seg.slice(0,2), +seg.slice(2));
        else if(seg.length%2===0){ for(let i=0;i<seg.length;i+=2) flat.push(+seg.slice(i,i+2)); }
        else flat.push(n);
      } else flat.push(n);
    });
    const enc = (a,b)=> par ? [a,b,par==='odd'?1:2] : [a,b];
    for(let i=0;i+1<flat.length;i+=2){
      let a=flat[i], b=flat[i+1];
      if(a>b){ const t=a; a=b; b=t; }                       // OCR "3-1" → 1-3
      if(a>totalWeeks && b>totalWeeks) continue;            // 噪声数字丢弃
      a=Math.min(Math.max(a,1),totalWeeks); b=Math.min(Math.max(b,1),totalWeeks);
      out.push(enc(a,b));
    }
    if(flat.length%2===1){
      const a=flat[flat.length-1];
      if(a>=1 && a<=totalWeeks) out.push(enc(a,a));
    }
  });
  return out.length ? out : [[1,totalWeeks]];
}
function roomFix(ln){
  let s = ln.replace(/[<＜]/g,'C');
  s = s.replace(/([A-Z])[量酚栓蛤棱枉星溺E](?=\d)/g,'$1座');
  s = s.replace(/[量酚栓蛤棱枉星溺](?=\d)/g,'座');
  return s;
}
const TITLE_RE = /(副教授|教授|讲师|助教|研究员|教师)/;
/* 教师/姓名混排行拆分:支持 [副教授]、(副教授)、无括号与表格竖线粘连 */
function splitTeacher(lnRaw){
  const ln = lnRaw.trim();
  if(ln.length > 24 || !TITLE_RE.test(ln)) return null;
  const s = ln.replace(/[()（）\[\]〔〕“”‘’]/g,'');
  const tm = TITLE_RE.exec(s);
  if(!tm) return null;
  const head = s.slice(0, tm.index).trim();
  if(!head) return null;
  const segs = head.split(/[|｜│]/).map(x=>x.trim()).filter(Boolean);
  let name = null, tea = null;
  for(const seg of segs){
    if(tea === null && seg.length >= 2 && seg.length <= 4 && !/\d/.test(seg)) tea = seg;
    else name = (name || '') + seg;
  }
  if(tea === null){
    const h = segs.join('');
    if(h.length >= 2 && h.length <= 4) tea = h;
    else if(h.length > 5){ tea = h.slice(-3); name = (name || '') + h.slice(0, -3); }
    else return null;
  }
  return [name, tea];
}
function parseCellLines(lines, totalWeeks){
  const entries = []; let cur = null;
  const close = ()=>{
    if(cur && cur.name && !/备注|周次|星期|点击查看/.test(cur.name)){
      const {hasWeeks, hasRoom, ...rest} = cur;
      entries.push(rest);
    }
    cur = null;
  };
  lines.forEach(raw=>{
    const ln = String(raw).trim();
    if(!ln) return;
    if(/^[-—－=――]{4,}$/.test(ln)){ close(); return; }
    const nz = ln.replace(/[\[（()）\]<＞>]/g,'').replace(/[同合]/g,'周');
    const wmk = nz.match(/([\d,\-－~、]{1,})\s*(单|双)?\s*[^\d]{0,2}周$/);
    if(wmk && cur && nz.length <= 20){
      cur.weeks = parseWeeksStr(wmk[1], wmk[2]==='单'?'odd': wmk[2]==='双'?'even':undefined, totalWeeks);
      cur.hasWeeks = true; return;
    }
    if(cur && cur.name){
      const st = splitTeacher(ln);
      if(st){
        if(st[0]) cur.name += st[0];
        cur.tea = st[1];
        return;
      }
    }
    let rf = roomFix(ln);
    const rm2 = rf.match(/^([A-Z])座?(\d{3,4})$/);
    if(rm2) rf = rm2[1] + '座' + rm2[2];
    if(cur && cur.name && /[座]\s*\d|楼\s*\d|教室|操场|场馆|^[A-Z]座?\d{3,4}$/.test(rf) && rf.length <= 14){
      cur.room = rf; cur.hasRoom = true; return;
    }
    if(cur && cur.hasWeeks) close();
    const clean = ln.replace(/^[。,.，、·\s]+/,'');
    if(!cur) cur = {name:clean, tea:'', weeks:[[1,totalWeeks]], room:'', hasWeeks:false, hasRoom:false};
    else if(!cur.name) cur.name = clean;
    else cur.name += clean;
  });
  close();
  return entries;
}
function weeksToText(ws){
  return ws.map(w=> (w[0]===w[1] ? `${w[0]}` : `${w[0]}-${w[1]}`) + (w[2]===1?'单': w[2]===2?'双':'')).join(',');
}
function parseWorkbook(buf, totalWeeks){
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
  let dayCols = null, headerIdx = -1;
  rows.forEach((r,i)=>{
    if(headerIdx>=0) return;
    const map = {};
    r.forEach((c,ci)=>{
      const v = String(c).trim();
      const k = DAYCN.findIndex(d=> v === '星期'+d || v === d);
      if(k>=0) map[k+1] = ci;
    });
    if(Object.keys(map).length >= 5){ dayCols = map; headerIdx = i; }
  });
  if(!dayCols) throw new Error('未找到星期表头');
  const entries = [];
  for(let i=headerIdx+1; i<rows.length; i++){
    const r = rows[i];
    const head = String(r[0]||'').trim();
    const bm = head.match(/^(\d+)\s*[-－~]\s*(\d+)/);
    if(!bm || /备注/.test(head)) continue;
    const band = BANDS.findIndex(b=> b.label.startsWith(bm[1]+'-'));
    if(band < 0) continue;
    for(const [day, ci] of Object.entries(dayCols)){
      const lines = String(r[ci]||'').split(/\r?\n/);
      parseCellLines(lines, totalWeeks).forEach(e=> entries.push({...e, day:+day, band}));
    }
  }
  if(!entries.length) throw new Error('表内未解析到课程');
  return entries;
}
window.CQ_PARSE_SHEET = function(b64, totalWeeks){
  try{
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    const es = parseWorkbook(u8.buffer, totalWeeks||22);
    return JSON.stringify({ok:true, entries: es.map(e=>({
      n:e.name, t:e.tea||'', r:e.room||'', d:e.day, b:e.band, w:weeksToText(e.weeks)
    }))});
  }catch(err){
    return JSON.stringify({ok:false, error:String(err && err.message || err)});
  }
};
</script>
</body></html>
